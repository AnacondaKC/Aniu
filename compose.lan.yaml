# Linux-only LAN deployment. No .env file is required.
# Docker host networking lets Aniu discover this machine's LAN IP safely.
name: aniu-lan

services:
  aniu:
    image: ghcr.io/anacondakc/aniu:latest
    pull_policy: always
    network_mode: host

    environment:
      ANIU_LAN: "1"

    volumes:
      - aniu-data:/app/data

    init: true
    restart: unless-stopped
    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true

    # Generate a strong first-run token inside the persistent volume.
    # Read it once with: docker compose -f compose.lan.yaml logs aniu
    entrypoint:
      - /bin/sh
      - -ec
      - |
        token_file=/app/data/.aniu-login-token
        if [ ! -s "$$token_file" ]; then
          umask 077
          python -c 'import secrets; print(secrets.token_urlsafe(32))' > "$$token_file"
          echo "Aniu first-run login token: $$(cat "$$token_file")"
        fi
        export ANIU_AUTH_TOKEN="$$(cat "$$token_file")"
        exec python -m backend.serve --host 0.0.0.0 --port 8000
    command: []

volumes:
  aniu-data:
