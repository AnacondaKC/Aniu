name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.5.0
        required: true
        type: string
      publish_latest:
        description: Also publish the latest tag
        required: true
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/anacondakc/aniu

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
          DISPATCH_PUBLISH_LATEST: ${{ inputs.publish_latest || false }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Release tag must be a Docker-compatible tag, for example v0.5.0"
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            publish_latest=true
            if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
              publish_latest=false
            fi
          else
            publish_latest="${DISPATCH_PUBLISH_LATEST}"
          fi

          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "publish_latest=${publish_latest}" >> "${GITHUB_OUTPUT}"

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.release.outputs.publish_latest == 'true' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=Aniu
            org.opencontainers.image.description=AI trading agent workspace
            org.opencontainers.image.source=https://github.com/AnacondaKC/Aniu
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}

      - name: Build and push Linux amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
